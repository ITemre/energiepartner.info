# AWS Amplify Hosting · Build-Spezifikation
#
# NICHT MEHR DER PRIMÄRE DEPLOY-WEG (08.09.). Beide Domains laufen über
# Vercel, die Anleitung steht in der README. Diese Datei bleibt als Rückweg
# stehen und wird von Vercel ignoriert.
#
# Der `.env.production`-Umweg weiter unten ist ausschließlich ein
# Amplify-Problem: Vercel reicht Umgebungsvariablen sowohl dem Build als auch
# der Laufzeit durch. Wer die Datei irgendwann löscht, verliert damit nichts
# außer der Amplify-Option.
#
# Die Anwendung braucht einen Server, sie ist keine statische Ausgabe:
#   - `src/app/api/lead/route.ts`  nimmt Anfragen an und spricht mit Bitrix24
#   - `src/proxy.ts`               entscheidet pro Anfrage anhand des Hosts,
#                                  welche der beiden Marken ausgeliefert wird
#   - `src/lib/google-reviews.ts`  ruft die Places API serverseitig ab
#
# In der Amplify-Konsole muss die App deshalb als Next.js SSR laufen
# („Web compute"), nicht als statisches Hosting. Bei `next export` oder
# „Static" fielen Lead-Route, Domain-Weiche und Bewertungen ersatzlos weg.
#
# KEINE SCHLÜSSEL IN DIESER DATEI. Alle Werte aus `.env.example` gehören
# in der Amplify-Konsole unter „Environment variables" hinterlegt. Was hier
# stünde, läge im öffentlichen Repository.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `ci` statt `install`: baut exakt gegen package-lock.json und
        # aktualisiert sie nie stillschweigend. Ein Deploy soll dieselben
        # Abhängigkeiten bekommen wie der lokale Stand, nicht die neuesten.
        - npm ci
    build:
      commands:
        # UMGEBUNGSVARIABLEN IN DIE LAUFZEIT DURCHREICHEN.
        #
        # Amplify stellt die in der Konsole gepflegten Variablen dem BUILD
        # zur Verfügung, aber nicht zuverlässig der SSR-Funktion, die später
        # die Anfragen bedient. Das führt zu einem Fehlerbild, das man leicht
        # falsch deutet: Alles, was beim Vorrendern gelesen wird
        # (`PLATZHALTER_INHALTE`), funktioniert – und alles, was erst zur
        # Anfragezeit gelesen wird, ist undefiniert. Konkret meldete
        # `/api/lead` 503 „Die Übermittlung ist gerade nicht möglich", weil
        # `BITRIX24_WEBHOOK_URL` im Lambda nicht ankam.
        #
        # Deshalb werden die benötigten Werte hier in eine `.env.production`
        # geschrieben. Next liest sie beim Build und nimmt sie in die
        # Server-Ausgabe auf, womit sie zur Laufzeit stehen.
        #
        # Die Datei entsteht nur im Build-Container und ist über `.env*` von
        # Git ausgeschlossen – es landet also kein Geheimnis im Repository.
        #
        # Das `|| true` ist Absicht: Findet `grep` keine einzige passende
        # Variable, liefert es Rückgabewert 1 und würde den Build abbrechen.
        # Eine fehlende Variable soll aber die Seite nicht verhindern, sie
        # soll nur die davon abhängige Funktion stillegen.
        - env | grep -E "^(BITRIX24_|GOOGLE_|PLATZHALTER_INHALTE=)" >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
